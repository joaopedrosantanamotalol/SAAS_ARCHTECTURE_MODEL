services:

  api:
    build: .
    env_file:
      - .env

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy


  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - api


  postgres:
    image: postgres:17
    container_name: postgres

    environment:
      POSTGRES_DB: model
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME} -d model"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: